[project]
name = "wanderer-ai-orchestrator"
version = "0.1.0"
description = "Wanderer AI orchestrator — Gemini conversation, memory, persona"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.16.0",
    "redis>=5.2.0",
    "google-genai>=0.3.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "orjson>=3.10.10",
    "tenacity>=9.0.0",
    "firebase-admin>=6.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "RUF", "ASYNC", "S", "C4", "PIE", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
